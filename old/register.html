<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Kim Inventories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <!-- Brand Logo -->
    <div class="auth-logo">
      <div class="logo-emblem">
        <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#3d5a2d" stroke-width="1.5" stroke-dasharray="3 2.5"/>
          <circle cx="35" cy="35" r="26" fill="none" stroke="#3d5a2d" stroke-width="1.5"/>
          <circle cx="35" cy="5"  r="2.5" fill="#3d5a2d"/>
          <circle cx="35" cy="65" r="2.5" fill="#3d5a2d"/>
          <circle cx="5"  cy="35" r="2.5" fill="#3d5a2d"/>
          <circle cx="65" cy="35" r="2.5" fill="#3d5a2d"/>
          <text x="35" y="46" text-anchor="middle" font-size="26" font-weight="900"
                fill="#3d5a2d" font-family="Georgia,serif">K</text>
        </svg>
      </div>
      <div class="logo-text">KIM INVENTORIES</div>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join Kim Inventories and manage your stock</p>

    <!-- Alerts -->
    <div class="alert-msg alert-error"   id="regError"   role="alert"></div>
    <div class="alert-msg alert-success" id="regSuccess" role="status"></div>

    <!-- Register Form -->
    <!-- Future: change action to "register.php" method="POST" and remove JS handler -->
    <form class="auth-form" id="registerForm" novalidate autocomplete="on">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" name="name"
               placeholder="Enter your full name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" name="email"
               placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password"
               placeholder="Minimum 6 characters" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <input type="password" id="regConfirm" name="confirm_password"
               placeholder="Repeat your password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <div class="auth-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

  </div><!-- /.auth-card -->

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;

      const errorEl   = document.getElementById('regError');
      const successEl = document.getElementById('regSuccess');
      errorEl.style.display   = 'none';
      successEl.style.display = 'none';

      // Validation
      if (!name || !email || !password || !confirm) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters long.';
        errorEl.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match. Please try again.';
        errorEl.style.display = 'block';
        return;
      }

      const result = attemptRegister(name, email, password);
      if (result.success) {
        successEl.textContent = 'Account created! Redirecting to login…';
        successEl.style.display = 'block';
        document.getElementById('registerForm').reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } else {
        errorEl.textContent = result.message;
        errorEl.style.display = 'block';
      }
    });
  </script>

</body>
</html>
