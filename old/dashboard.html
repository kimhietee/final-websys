<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Kim Inventories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-emblem">
        <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#3d5a2d" stroke-width="1.5" stroke-dasharray="3 2.5"/>
          <circle cx="35" cy="35" r="26" fill="none" stroke="#3d5a2d" stroke-width="1.5"/>
          <circle cx="35" cy="5"  r="2.5" fill="#3d5a2d"/>
          <circle cx="35" cy="65" r="2.5" fill="#3d5a2d"/>
          <circle cx="5"  cy="35" r="2.5" fill="#3d5a2d"/>
          <circle cx="65" cy="35" r="2.5" fill="#3d5a2d"/>
          <text x="35" y="46" text-anchor="middle" font-size="26" font-weight="900"
                fill="#3d5a2d" font-family="Georgia,serif">K</text>
        </svg>
      </div>
      <div class="logo-text">KIM INVENTORIES</div>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html"    class="nav-item active"><i class="bi bi-grid-fill"></i>    Dashboard</a>
      <a href="products.html"     class="nav-item"><i class="bi bi-box-seam"></i>            Products</a>
      <a href="stock-summary.html"class="nav-item"><i class="bi bi-bar-chart-fill"></i>      Stock Summary</a>
      <a href="profile.html"      class="nav-item"><i class="bi bi-person-fill"></i>         Profile</a>
    </nav>

    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Log out
      </button>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
      <h2 id="welcomeMsg">Good day, Admin! 👋</h2>
      <p>Here's a quick overview of your inventory today.</p>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards" id="statCards">
      <div class="stat-card">
        <div class="stat-label">Total Stock</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Value</div>
        <div class="stat-value" id="statValue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Stock Products</div>
        <div class="stat-value" id="statLow">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Out of Stock</div>
        <div class="stat-value" id="statOut">—</div>
      </div>
    </div>

    <!-- Dashboard Grid: Recent Products + Quick Category -->
    <div class="dashboard-grid">

      <!-- Recent Products -->
      <div class="content-card-solid">
        <div class="section-heading">Recent Products</div>
        <table class="recent-table" id="recentTable">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="recentTableBody"></tbody>
        </table>
        <div style="margin-top:14px; text-align:right;">
          <a href="products.html" class="btn-primary-green" style="font-size:13px; padding:7px 18px; border-radius:8px;">
            View All Products <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>

      <!-- Category Snapshot -->
      <div class="content-card-solid">
        <div class="section-heading">Stock by Category</div>
        <div id="categoryList"></div>
      </div>

    </div><!-- /.dashboard-grid -->

  </main>

</div><!-- /.app-wrapper -->

<!-- Toast -->
<div class="toast-notif" id="toastNotif"></div>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
  requireAuth();

  const user  = getSession();
  const stats = getStockStats();

  // Personalise welcome message
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('welcomeMsg').textContent = `${greeting}, ${user.name}! 👋`;

  // Fill stat cards
  document.getElementById('statTotal').textContent = stats.totalStock.toLocaleString();
  document.getElementById('statValue').textContent = formatPeso(stats.totalValue);
  document.getElementById('statLow').textContent   = stats.lowStockCount;
  document.getElementById('statOut').textContent   = stats.outStockCount;

  // Recent products (latest 6 entries)
  const recent = [...PRODUCTS_DATA].slice(-6).reverse();
  const tbody  = document.getElementById('recentTableBody');
  recent.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="product-name-cell">${p.name}</td>
      <td>${p.category}</td>
      <td>${p.quantity}</td>
      <td class="product-price">${formatPeso(p.price)}</td>
      <td>${statusBadgeHtml(p.quantity)}</td>
    `;
    tbody.appendChild(tr);
  });

  // Category snapshot
  const cats = getCategoryTotals();
  const maxQty = Math.max(...Object.values(cats));
  const catEl  = document.getElementById('categoryList');
  Object.entries(cats).forEach(([cat, qty]) => {
    const pct = Math.round((qty / maxQty) * 100);
    catEl.innerHTML += `
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
          <span style="font-size:13.5px;font-weight:700;color:var(--text-dark);">${cat}</span>
          <span style="font-size:13px;font-weight:700;color:var(--primary-dark);">${qty} units</span>
        </div>
        <div style="background:var(--card-bg);border-radius:20px;height:8px;overflow:hidden;">
          <div style="background:var(--primary);width:${pct}%;height:100%;border-radius:20px;transition:width 0.6s ease;"></div>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
