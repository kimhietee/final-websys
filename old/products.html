<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Kim Inventories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-emblem">
        <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#3d5a2d" stroke-width="1.5" stroke-dasharray="3 2.5"/>
          <circle cx="35" cy="35" r="26" fill="none" stroke="#3d5a2d" stroke-width="1.5"/>
          <circle cx="35" cy="5"  r="2.5" fill="#3d5a2d"/>
          <circle cx="35" cy="65" r="2.5" fill="#3d5a2d"/>
          <circle cx="5"  cy="35" r="2.5" fill="#3d5a2d"/>
          <circle cx="65" cy="35" r="2.5" fill="#3d5a2d"/>
          <text x="35" y="46" text-anchor="middle" font-size="26" font-weight="900"
                fill="#3d5a2d" font-family="Georgia,serif">K</text>
        </svg>
      </div>
      <div class="logo-text">KIM INVENTORIES</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"    class="nav-item"><i class="bi bi-grid-fill"></i>           Dashboard</a>
      <a href="products.html"     class="nav-item active"><i class="bi bi-box-seam"></i>     Products</a>
      <a href="stock-summary.html"class="nav-item"><i class="bi bi-bar-chart-fill"></i>      Stock Summary</a>
      <a href="profile.html"      class="nav-item"><i class="bi bi-person-fill"></i>         Profile</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Log out
      </button>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- Page Header -->
    <div class="page-header-row">
      <h1 class="page-title">Products</h1>
      <button class="btn-primary-green" onclick="openAddModal()">
        <i class="bi bi-plus-lg"></i> Add Product
      </button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-wrapper">
        <i class="bi bi-search"></i>
        <input type="text" class="search-input" id="searchInput"
               placeholder="Search products…" oninput="renderTable()" />
      </div>
      <select class="filter-select" id="catFilter" onchange="renderTable()">
        <option value="">All Categories</option>
        <option value="Beverages">Beverages</option>
        <option value="Pastries">Pastries</option>
        <option value="Light Meals">Light Meals</option>
        <option value="Others">Others</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="renderTable()">
        <option value="">All Status</option>
        <option value="in-stock">In Stock</option>
        <option value="low-stock">Low Stock</option>
        <option value="out-of-stock">Out of Stock</option>
      </select>
    </div>

    <!-- Products Table -->
    <div class="content-card" style="padding:0; overflow:hidden; border-radius:var(--radius-lg);">
      <table class="products-table" id="productsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsTbody"></tbody>
      </table>
    </div>

    <!-- Row count -->
    <div style="margin-top:12px; font-size:13px; color:var(--text-light); font-weight:600;">
      Showing <span id="rowCount">0</span> product(s)
    </div>

  </main>
</div><!-- /.app-wrapper -->

<!-- ===== ADD / EDIT MODAL ===== -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Product</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form class="modal-form" id="productForm" novalidate>
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label for="prodName">Product Name</label>
        <input type="text" id="prodName" placeholder="e.g. Americano" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="prodCategory">Category</label>
          <select id="prodCategory" required>
            <option value="">Select…</option>
            <option value="Beverages">Beverages</option>
            <option value="Pastries">Pastries</option>
            <option value="Light Meals">Light Meals</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prodUnit">Unit</label>
          <input type="text" id="prodUnit" placeholder="e.g. piece, cup" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="prodPrice">Unit Price (₱)</label>
          <input type="number" id="prodPrice" placeholder="0" min="0" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="prodQty">Quantity</label>
          <input type="number" id="prodQty" placeholder="0" min="0" step="1" required />
        </div>
      </div>
      <!-- Alert inside modal -->
      <div class="alert-msg alert-error" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel-sm" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary-green" style="border-radius:var(--radius-sm);padding:9px 22px;">Save Product</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== DELETE CONFIRM MODAL ===== -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="max-width:380px;">
    <div class="modal-header">
      <div class="modal-title" style="color:#c62828;">Delete Product</div>
      <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
    </div>
    <p style="font-size:14px;color:var(--text-medium);margin-bottom:20px;">
      Are you sure you want to delete <strong id="deleteProductName"></strong>?
      This action cannot be undone.
    </p>
    <div class="modal-actions">
      <button class="btn-cancel-sm" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-danger-sm" style="padding:9px 20px;font-size:13.5px;" onclick="confirmDelete()">
        Yes, Delete
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-notif" id="toastNotif"></div>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
  requireAuth();

  let deleteTargetId = null;

  // ─── Render Table ──────────────────────────────────────────────────────────
  function renderTable() {
    const search    = document.getElementById('searchInput').value.toLowerCase();
    const catFilter = document.getElementById('catFilter').value;
    const stFilter  = document.getElementById('statusFilter').value;

    const filtered = PRODUCTS_DATA.filter(p => {
      const matchSearch = p.name.toLowerCase().includes(search) ||
                          p.category.toLowerCase().includes(search);
      const matchCat    = !catFilter  || p.category === catFilter;
      const matchStatus = !stFilter   || getProductStatus(p.quantity) === stFilter;
      return matchSearch && matchCat && matchStatus;
    });

    const tbody = document.getElementById('productsTbody');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr class="no-results"><td colspan="7">No products found.</td></tr>`;
      document.getElementById('rowCount').textContent = 0;
      return;
    }

    filtered.forEach((p, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--text-light);font-weight:700;">${i + 1}</td>
        <td class="product-name">${p.name}</td>
        <td>${p.category}</td>
        <td class="product-price">${formatPeso(p.price)}</td>
        <td>${p.quantity} <span style="font-size:11px;color:var(--text-light);">${p.unit || ''}</span></td>
        <td>${statusBadgeHtml(p.quantity)}</td>
        <td>
          <div class="td-actions">
            <button class="btn-edit" onclick="openEditModal(${p.id})">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn-danger-sm" onclick="openDeleteModal(${p.id})">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('rowCount').textContent = filtered.length;
  }

  // ─── Add Modal ─────────────────────────────────────────────────────────────
  function openAddModal() {
    document.getElementById('modalTitle').textContent   = 'Add Product';
    document.getElementById('editId').value             = '';
    document.getElementById('productForm').reset();
    document.getElementById('modalError').style.display = 'none';
    document.getElementById('productModal').classList.add('active');
  }

  // ─── Edit Modal ────────────────────────────────────────────────────────────
  function openEditModal(id) {
    const p = PRODUCTS_DATA.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent   = 'Edit Product';
    document.getElementById('editId').value             = id;
    document.getElementById('prodName').value           = p.name;
    document.getElementById('prodCategory').value       = p.category;
    document.getElementById('prodUnit').value           = p.unit || '';
    document.getElementById('prodPrice').value          = p.price;
    document.getElementById('prodQty').value            = p.quantity;
    document.getElementById('modalError').style.display = 'none';
    document.getElementById('productModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('productModal').classList.remove('active');
  }

  // ─── Form Submit (Add or Edit) ─────────────────────────────────────────────
  document.getElementById('productForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const name     = document.getElementById('prodName').value.trim();
    const category = document.getElementById('prodCategory').value;
    const unit     = document.getElementById('prodUnit').value.trim();
    const price    = parseFloat(document.getElementById('prodPrice').value);
    const quantity = parseInt(document.getElementById('prodQty').value, 10);
    const errorEl  = document.getElementById('modalError');

    errorEl.style.display = 'none';

    if (!name || !category || isNaN(price) || isNaN(quantity) || price < 0 || quantity < 0) {
      errorEl.textContent = 'Please fill in all required fields with valid values.';
      errorEl.style.display = 'block';
      return;
    }

    const editId = document.getElementById('editId').value;

    if (editId) {
      // Edit existing
      updateProduct(parseInt(editId), { name, category, unit, price, quantity });
      showToast('Product updated successfully!');
    } else {
      // Add new
      addProduct({ name, category, unit, price, quantity });
      showToast('Product added successfully!');
    }

    closeModal();
    renderTable();
  });

  // ─── Delete Modal ──────────────────────────────────────────────────────────
  function openDeleteModal(id) {
    const p = PRODUCTS_DATA.find(x => x.id === id);
    if (!p) return;
    deleteTargetId = id;
    document.getElementById('deleteProductName').textContent = p.name;
    document.getElementById('deleteModal').classList.add('active');
  }

  function closeDeleteModal() {
    deleteTargetId = null;
    document.getElementById('deleteModal').classList.remove('active');
  }

  function confirmDelete() {
    if (deleteTargetId === null) return;
    deleteProduct(deleteTargetId);
    closeDeleteModal();
    renderTable();
    showToast('Product deleted.');
  }

  // Close modal on overlay click
  document.getElementById('productModal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('deleteModal').addEventListener('click', function (e) {
    if (e.target === this) closeDeleteModal();
  });

  // Initial render
  renderTable();
</script>

</body>
</html>
