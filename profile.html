<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Kim Inventories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-emblem">
        <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#3d5a2d" stroke-width="1.5" stroke-dasharray="3 2.5"/>
          <circle cx="35" cy="35" r="26" fill="none" stroke="#3d5a2d" stroke-width="1.5"/>
          <circle cx="35" cy="5"  r="2.5" fill="#3d5a2d"/>
          <circle cx="35" cy="65" r="2.5" fill="#3d5a2d"/>
          <circle cx="5"  cy="35" r="2.5" fill="#3d5a2d"/>
          <circle cx="65" cy="35" r="2.5" fill="#3d5a2d"/>
          <text x="35" y="46" text-anchor="middle" font-size="26" font-weight="900"
                fill="#3d5a2d" font-family="Georgia,serif">K</text>
        </svg>
      </div>
      <div class="logo-text">KIM INVENTORIES</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"    class="nav-item"><i class="bi bi-grid-fill"></i>            Dashboard</a>
      <a href="products.html"     class="nav-item"><i class="bi bi-box-seam"></i>             Products</a>
      <a href="stock-summary.html"class="nav-item"><i class="bi bi-bar-chart-fill"></i>       Stock Summary</a>
      <a href="profile.html"      class="nav-item active"><i class="bi bi-person-fill"></i>   Profile</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Log out
      </button>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <h1 class="page-title">Profile</h1>

    <!-- Outer dashed wrapper card -->
    <div class="content-card">
      <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:24px; align-items:start;">

        <!-- ── Left Card: Contact Info ── -->
        <div class="content-card-solid">

          <!-- Photo area -->
          <div class="profile-photo-area">
            <div class="photo-circle" id="photoCircle" onclick="document.getElementById('photoInput').click()" title="Click to change photo">
              <i class="bi bi-person-fill" id="photoIcon"></i>
              <img id="photoPreview" src="" alt="Profile Photo" style="display:none;" />
            </div>
            <button class="upload-photo-btn" onclick="document.getElementById('photoInput').click()">
              <i class="bi bi-upload"></i> Upload Photo
            </button>
            <!-- Hidden file input -->
            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)" />
          </div>

          <!-- Name Field -->
          <div class="profile-field">
            <div class="profile-field-info" style="flex:1;">
              <div class="field-label">Your Name</div>
              <div class="field-value" id="nameVal"></div>
              <input class="field-edit-input" type="text" id="nameInput" placeholder="Full name" />
              <div class="field-edit-actions" id="nameActions">
                <button class="btn-save"      onclick="saveField('name')">Save</button>
                <button class="btn-cancel-sm" onclick="cancelField('name')">Cancel</button>
              </div>
            </div>
            <button class="btn-edit" id="nameEditBtn" onclick="editField('name')">Edit</button>
          </div>

          <!-- Email Field -->
          <div class="profile-field">
            <div class="profile-field-info" style="flex:1;">
              <div class="field-label">Email</div>
              <div class="field-value" id="emailVal"></div>
              <input class="field-edit-input" type="email" id="emailInput" placeholder="Email address" />
              <div class="field-edit-actions" id="emailActions">
                <button class="btn-save"      onclick="saveField('email')">Save</button>
                <button class="btn-cancel-sm" onclick="cancelField('email')">Cancel</button>
              </div>
            </div>
            <button class="btn-edit" id="emailEditBtn" onclick="editField('email')">Edit</button>
          </div>

          <!-- Phone Field -->
          <div class="profile-field">
            <div class="profile-field-info" style="flex:1;">
              <div class="field-label">Phone Number</div>
              <div class="field-value" id="phoneVal"></div>
              <input class="field-edit-input" type="tel" id="phoneInput" placeholder="+63 900 000 0000" />
              <div class="field-edit-actions" id="phoneActions">
                <button class="btn-save"      onclick="saveField('phone')">Save</button>
                <button class="btn-cancel-sm" onclick="cancelField('phone')">Cancel</button>
              </div>
            </div>
            <button class="btn-edit" id="phoneEditBtn" onclick="editField('phone')">Edit</button>
          </div>

        </div><!-- /.content-card-solid (left) -->

        <!-- ── Right Card: About ── -->
        <div class="content-card-solid">

          <div class="about-card-header">
            <div class="about-card-title">
              About <span id="aboutNameLabel"></span>
            </div>
            <button class="btn-edit" id="aboutEditBtn" onclick="editAbout()">Edit</button>
          </div>

          <p class="about-text" id="aboutText"></p>
          <textarea class="about-textarea" id="aboutInput"
                    placeholder="Write a short bio…"></textarea>
          <div class="field-edit-actions" id="aboutActions" style="margin-top:10px;">
            <button class="btn-save"      onclick="saveAbout()">Save</button>
            <button class="btn-cancel-sm" onclick="cancelAbout()">Cancel</button>
          </div>

        </div><!-- /.content-card-solid (right) -->

      </div><!-- /.grid -->
    </div><!-- /.content-card -->

  </main>
</div><!-- /.app-wrapper -->

<!-- Toast -->
<div class="toast-notif" id="toastNotif"></div>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script>
  requireAuth();

  // ─── Populate Fields from Session ─────────────────────────────────────────
  function populateProfile() {
    const user = getSession();
    document.getElementById('nameVal').textContent      = user.name  || '—';
    document.getElementById('emailVal').textContent     = user.email || '—';
    document.getElementById('phoneVal').textContent     = user.phone || '—';
    document.getElementById('aboutText').textContent    = user.about || 'No bio added yet.';
    document.getElementById('aboutNameLabel').textContent = user.name || '';
  }

  populateProfile();

  // ─── Inline Field Edit ─────────────────────────────────────────────────────
  // Fields: name | email | phone
  const fieldMap = {
    name:  { key: 'name',  valId: 'nameVal',  inputId: 'nameInput',  actionsId: 'nameActions',  editBtnId: 'nameEditBtn'  },
    email: { key: 'email', valId: 'emailVal', inputId: 'emailInput', actionsId: 'emailActions', editBtnId: 'emailEditBtn' },
    phone: { key: 'phone', valId: 'phoneVal', inputId: 'phoneInput', actionsId: 'phoneActions', editBtnId: 'phoneEditBtn' }
  };

  function editField(field) {
    const f     = fieldMap[field];
    const user  = getSession();
    const input = document.getElementById(f.inputId);
    input.value = user[f.key] || '';
    // Show input + actions, hide display value + edit button
    document.getElementById(f.valId).style.display     = 'none';
    document.getElementById(f.editBtnId).style.display = 'none';
    input.style.display = 'block';
    document.getElementById(f.actionsId).style.display = 'flex';
    input.focus();
  }

  function saveField(field) {
    const f     = fieldMap[field];
    const input = document.getElementById(f.inputId);
    const val   = input.value.trim();

    if (!val) {
      input.style.border = '1.5px solid #ef4444';
      return;
    }
    input.style.border = '';

    const updates = {};
    updates[f.key] = val;
    updateSession(updates);
    populateProfile();

    // Re-hide
    input.style.display = 'none';
    document.getElementById(f.actionsId).style.display = 'none';
    document.getElementById(f.valId).style.display     = 'block';
    document.getElementById(f.editBtnId).style.display = '';
    showToast('Profile updated!');
  }

  function cancelField(field) {
    const f = fieldMap[field];
    document.getElementById(f.inputId).style.display     = 'none';
    document.getElementById(f.actionsId).style.display   = 'none';
    document.getElementById(f.valId).style.display       = 'block';
    document.getElementById(f.editBtnId).style.display   = '';
  }

  // ─── About Edit ────────────────────────────────────────────────────────────
  function editAbout() {
    const user = getSession();
    document.getElementById('aboutInput').value       = user.about || '';
    document.getElementById('aboutText').style.display   = 'none';
    document.getElementById('aboutEditBtn').style.display = 'none';
    document.getElementById('aboutInput').style.display  = 'block';
    document.getElementById('aboutActions').style.display = 'flex';
    document.getElementById('aboutInput').focus();
  }

  function saveAbout() {
    const val = document.getElementById('aboutInput').value.trim();
    updateSession({ about: val });
    populateProfile();
    cancelAbout();
    showToast('Bio updated!');
  }

  function cancelAbout() {
    document.getElementById('aboutInput').style.display   = 'none';
    document.getElementById('aboutActions').style.display = 'none';
    document.getElementById('aboutText').style.display    = 'block';
    document.getElementById('aboutEditBtn').style.display = '';
  }

  // ─── Photo Upload (preview only — no server upload in static version) ──────
  function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const preview = document.getElementById('photoPreview');
      const icon    = document.getElementById('photoIcon');
      preview.src           = e.target.result;
      preview.style.display = 'block';
      icon.style.display    = 'none';
    };
    reader.readAsDataURL(file);
    showToast('Photo updated! (preview only in static mode)');
  }
</script>

</body>
</html>
